[package]
name = "pong"
version = "0.1.0"
edition = "2024"

# [lib]
# crate-type = ["cdylib", "rlib"]

[dependencies]
bevy = { version = "0.18", features = ["dynamic_linking"] }
# bevy_rapier2d = "0.30"
rand = "0.9.2"
# wasm-bindgen = "0.3"

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3
